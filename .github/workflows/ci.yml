name: CI

# Build check + unit tests, on every push and pull request: does the frontend
# (expo-builder-gui) still build; does cli/ still build, vet, and pass its unit
# tests natively on Linux and Windows (actions/setup-go, no CMake/vcpkg/MSVC
# needed anymore - the CLI is a plain Go module); does the Inno Setup installer
# script (windows/installer) still compile against that Windows build?
# Deliberately still scoped to just this - no orchestrator build check, no macOS
# job (not supported yet at all).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-builder-local/expo-builder-gui
    steps:
      - uses: actions/checkout@v4
        with:
          path: expo-builder-local

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-builder-local/expo-builder-gui/package-lock.json

      - run: npm ci
      - run: npm run build

  linux-cli-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-builder-local
    steps:
      - uses: actions/checkout@v4
        with:
          path: expo-builder-local

      - uses: actions/setup-go@v5
        with:
          go-version-file: expo-builder-local/cli/go.mod

      # See cli/scripts/sync-runner-assets.sh's own comment - //go:embed can't
      # reference ../docker/runner directly, so this copies it in first. Required
      # before build/vet/test alike (runnerctx's package won't compile without it).
      - run: ./scripts/sync-runner-assets.sh
        working-directory: expo-builder-local/cli

      - run: go build ./...
        working-directory: expo-builder-local/cli
      - run: go vet ./...
        working-directory: expo-builder-local/cli
      - run: gofmt -l . | (! grep .)
        working-directory: expo-builder-local/cli
      - run: go test ./...
        working-directory: expo-builder-local/cli

  windows-cli-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expo-builder-local
    steps:
      - uses: actions/checkout@v4
        with:
          path: expo-builder-local

      - uses: actions/setup-go@v5
        with:
          go-version-file: expo-builder-local/cli/go.mod

      - name: Sync docker/runner assets for //go:embed
        shell: bash
        run: ./scripts/sync-runner-assets.sh
        working-directory: expo-builder-local/cli

      - run: go build ./...
        working-directory: expo-builder-local/cli
      - run: go vet ./...
        working-directory: expo-builder-local/cli
      - run: go test ./...
        working-directory: expo-builder-local/cli

      # Regenerate the Windows icon/version resource (see cmd/ebl/main.go's
      # //go:generate comment) and build the real ebl.exe, so the Inno Setup
      # compile check below exercises the same artifact a release would produce.
      - name: Build ebl.exe
        shell: bash
        run: |
          set -e
          VERSION="$(cat VERSION)"
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -o cmd/ebl/resource_windows_amd64.syso cmd/ebl/versioninfo.json
          go build -ldflags "-X main.version=$VERSION" -o build/install/bin/ebl.exe ./cmd/ebl
        working-directory: expo-builder-local/cli

      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\ebl.iss'
