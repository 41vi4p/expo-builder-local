name: Build and publish APT repository

# Builds the `ebl` .deb with a static (CGO_ENABLED=0) `go build` + `nfpm` (see
# packaging/deb/nfpm.yaml), assembles a signed APT repository tree, and publishes
# it to the gh-pages branch under /apt so `apt install ebl` works from
# https://41vi4p.github.io/expo-builder-local/apt. Also attaches the same .deb (plus
# a plain tarball for install.sh) to a GitHub Release as a direct-download fallback.
# A second job (windows-build-and-publish) then builds cli/ natively for Windows
# (plain `go build`, no vcpkg/MSVC needed) and the Inno Setup installer
# (windows/installer), and attaches both to the same release — see
# windows/install.ps1's header comment for what those are.
#
# Requires (set up once via docs/APT_REPO_SETUP_GUIDE.md, not by this workflow):
#   - repo secret APT_GPG_PRIVATE_KEY: the armored private signing key
#   - docs/apt/pubkey.gpg committed: the matching public key, published as-is
#   - GitHub Pages enabled, serving from the gh-pages branch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-builder-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: expo-builder-local
          # Full history (including all tags), not just the tagged commit - needed
          # below to find the previous tag for the release's "Full Changelog"
          # compare link.
          fetch-depth: 0

      - name: Verify public key is committed
        run: |
          if [ ! -f docs/apt/pubkey.gpg ]; then
            echo "::error::docs/apt/pubkey.gpg is missing. Complete docs/APT_REPO_SETUP_GUIDE.md first (generate the GPG key, commit the public half there) before this workflow can publish a signed repo."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: expo-builder-local/cli/go.mod

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0

      - name: Build ebl (static) and package the .deb
        run: |
          set -e
          VERSION="$(cat cli/VERSION)"
          ./cli/scripts/sync-runner-assets.sh
          CGO_ENABLED=0 go build -C cli -ldflags "-X main.version=${VERSION}" -o build/ebl ./cmd/ebl
          mkdir -p build/packages/deb
          VERSION="${VERSION}" nfpm package --config packaging/deb/nfpm.yaml --packager deb --target build/packages/deb/
          file cli/build/ebl

      - name: Stage a plain install tree (for install.sh's fallback path)
        run: |
          mkdir -p stage/bin
          cp cli/build/ebl stage/bin/ebl
          tar -czf "ebl-${GITHUB_REF_NAME:-dev}-linux-amd64.tar.gz" -C stage .

      - name: Assemble APT repository tree
        run: |
          set -e
          # GitHub's runner image pre-registers a google-chrome.list apt source we
          # never use here - when Google's own mirror has a transient hash-sum
          # mismatch (real, observed failure - not caused by anything in this repo),
          # a plain `apt-get update` fails outright even though every package we
          # actually want is fine. Drop it first so this doesn't depend on a third
          # party's mirror being healthy. (The earlier "Build .deb inside a pinned
          # Ubuntu 24.04 container" step doesn't need this - that's a fresh
          # ubuntu:24.04 container, not this runner, so it never has this file.)
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils gnupg

          mkdir -p apt-repo/pool/main/e/ebl
          cp build/packages/deb/*.deb apt-repo/pool/main/e/ebl/
          cp docs/apt/pubkey.gpg apt-repo/pubkey.gpg

          mkdir -p apt-repo/dists/stable/main/binary-amd64
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

      - name: Sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret APT_GPG_PRIVATE_KEY is not set. See docs/APT_REPO_SETUP_GUIDE.md."
            exit 1
          fi

          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"

          cd apt-repo/dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="expo-builder-local" \
            -o APT::FTPArchive::Release::Label="expo-builder-local" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="expo-builder-local APT repository (the ebl CLI)" \
            release . > Release

          gpg --batch --yes --default-key "$KEY_ID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$KEY_ID" --clearsign -o InRelease Release

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: expo-builder-local/apt-repo
          publish_branch: gh-pages
          destination_dir: apt
          keep_files: true

      - name: Checksums
        run: sha256sum build/packages/deb/*.deb ebl-*-linux-amd64.tar.gz > SHA256SUMS.txt

      - name: Extract this version's docs/CHANGELOG.md section for the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          # Pull out the "## v<this tag> - ..." section verbatim, stopping at the
          # next "## " heading - this is the actual human-written summary of what
          # changed, not GitHub's auto-generated PR/commit list (--generate-notes),
          # which is noisy and doesn't explain *why* anything changed.
          awk -v want="## ${GITHUB_REF_NAME} " '
            index($0, want) == 1 { printing = 1 }
            printing && /^## / && index($0, want) != 1 { exit }
            printing { print }
          ' docs/CHANGELOG.md > /tmp/release-notes.md

          # Fall back to GitHub's auto-generated notes if this tag has no matching
          # changelog section (shouldn't normally happen - every release should get
          # one - but better than an empty release body).
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::No docs/CHANGELOG.md section found for ${GITHUB_REF_NAME} - falling back to auto-generated notes."
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body > /tmp/release-notes.md
          fi

          # Append a "Full Changelog" compare link against the previous tag, the one
          # useful thing --generate-notes provided that a hand-written changelog
          # section doesn't - computed by hand since we're not using that flag.
          PREV_TAG="$(git tag --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | tail -n1)"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${GITHUB_REF_NAME}" ]; then
            echo "" >> /tmp/release-notes.md
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release (direct-download fallback)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ebl ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            build/packages/deb/*.deb \
            ebl-*-linux-amd64.tar.gz \
            SHA256SUMS.txt

  windows-build-and-publish:
    # Runs after build-and-publish so the release already exists — this job only
    # attaches the Windows artifacts to it via `gh release upload`, it doesn't
    # create the release itself. ebl.exe here is cli/ built natively for Windows
    # (same source every other platform uses — see windows/install.ps1's header);
    # ebl-setup-<version>.exe wraps that same build in an Inno Setup GUI installer.
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expo-builder-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: expo-builder-local

      - uses: actions/setup-go@v5
        with:
          go-version-file: expo-builder-local/cli/go.mod

      - name: Sync docker/runner assets for //go:embed
        shell: bash
        run: ./scripts/sync-runner-assets.sh
        working-directory: expo-builder-local/cli

      - name: Generate the Windows icon/version resource
        shell: bash
        run: go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -o cmd/ebl/resource_windows_amd64.syso cmd/ebl/versioninfo.json
        working-directory: expo-builder-local/cli

      - name: Build ebl.exe
        shell: bash
        run: go build -ldflags "-X main.version=$(cat VERSION)" -o build/install/bin/ebl.exe ./cmd/ebl
        working-directory: expo-builder-local/cli

      - name: Package the direct-download zip
        run: Compress-Archive -Path cli\build\install\bin -DestinationPath ebl-windows-amd64.zip

      - name: Build the Inno Setup installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\ebl.iss

      - name: Attach Windows artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ebl.iss names the output ebl-setup-<MyAppVersion>.exe (versioned like the
          # .deb's ebl_<version>_amd64.deb) - resolved here rather than hardcoded so
          # this doesn't need editing every time MyAppVersion is bumped.
          $innoExe = Get-ChildItem "windows\installer\dist\ebl-setup-*.exe" | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" `
            ebl-windows-amd64.zip `
            $innoExe.FullName `
            --clobber
